name: Build DailyFlow APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project ZIP
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *.zip | head -n 1)
            unzip -o -q "$ZIP" -d unpacked
            ROOT=$(dirname "$(find unpacked -name settings.gradle.kts | head -n 1)")
            cp -a "$ROOT"/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk DailyFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DailyFlow-APK
          path: DailyFlow.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DailyFlow build ${{ github.run_number }}
          files: DailyFlow.apk
          make_latest: true
